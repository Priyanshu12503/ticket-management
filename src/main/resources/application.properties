# Support Ticket Management System Configuration

# Application
spring.application.name=ticket-management

# Default local development database: H2 in-memory
spring.datasource.url=jdbc:h2:mem:ticket_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - let Hibernate create schema automatically
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# H2 Console (development only - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DataSource Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Database Migrations - disabled for H2 (Hibernate handles schema)
spring.flyway.enabled=false

# Server
server.servlet.context-path=/
server.port=8080
server.compression.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.ticketmanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG